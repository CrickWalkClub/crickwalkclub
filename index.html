<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Club</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #242424;
            --surface3: #2e2e2e;
            --border: #333;
            --border2: #444;
            --text: #f0f0f0;
            --text2: #aaa;
            --text3: #666;
            --accent: #6db87a;
            --accent-dim: rgba(109,184,122,0.15);
            --header-bg: #141414;
            --danger: #e05555;
            --shadow: 0 4px 24px rgba(0,0,0,0.6);
            --modal-bg: rgba(0,0,0,0.75);
        }
        :root[data-theme="light"] {
            --bg: #f4f4f0;
            --surface: #ffffff;
            --surface2: #f0f0ec;
            --surface3: #e8e8e4;
            --border: #ddd;
            --border2: #ccc;
            --text: #1a1a1a;
            --text2: #555;
            --text3: #999;
            --accent: #3a7d48;
            --accent-dim: #d4ead9;
            --header-bg: #ffffff;
            --danger: #cc3333;
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
            --modal-bg: rgba(0,0,0,0.4);
        }
 
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
 
        /* HEADER */
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 500;
        }
        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
        .header-right { display: flex; align-items: center; gap: 8px; }
 
        .data-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text2);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .data-btn:hover { background: var(--surface3); color: var(--text); }
 
        .theme-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
        .toggle-switch {
            width: 38px; height: 21px;
            background: var(--surface3);
            border-radius: 12px;
            border: 1px solid var(--border2);
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 15px; height: 15px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform 0.2s;
        }
        [data-theme="light"] .toggle-switch::after { transform: translateX(17px); }
 
        /* NAV — bottom on mobile, top on desktop */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            padding: 0 1.25rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        nav::-webkit-scrollbar { display: none; }
        .nav-tab {
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text2);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .nav-tab:hover { color: var(--text); }
        .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
 
        main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
        .section { display: none; }
        .section.active { display: block; }
 
        /* MAP */
        #map {
            width: 100%; height: 380px;
            border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .map-controls { display: flex; gap: 8px; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .map-btn {
            padding: 7px 13px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .map-btn:hover, .map-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
 
        /* CALENDAR */
        .cal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem; gap: 0.75rem; flex-wrap: wrap;
        }
        .cal-controls { display: flex; align-items: center; gap: 8px; }
        .cal-title { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--text); }
        .cal-nav-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .cal-selects { display: flex; gap: 6px; }
        .cal-selects select {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
        }
        .calendar-grid {
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .cal-day-headers {
            display: grid; grid-template-columns: repeat(7, 1fr);
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        .cal-day-header {
            text-align: center; padding: 8px 0;
            font-size: 11px; font-weight: 600;
            color: var(--text2); letter-spacing: 0.04em; text-transform: uppercase;
        }
        .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
        .cal-cell {
            min-height: 70px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 5px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cal-cell:nth-child(7n) { border-right: none; }
        .cal-cell:hover { background: var(--surface2); }
        .cal-cell.empty { cursor: default; background: var(--bg); opacity: 0.35; }
        .cal-cell.past { opacity: 0.5; }
        .cal-cell.today .day-num {
            background: var(--accent); color: #fff;
            border-radius: 50%;
        }
        .day-num {
            font-size: 12px; font-weight: 500; color: var(--text2);
            width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 3px;
        }
        /* colour coded dots */
        .walk-dot {
            font-size: 9px;
            border-radius: 3px;
            padding: 1px 4px;
            margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border: 1px solid transparent;
        }
        .walk-dot.local     { background: rgba(109,184,122,0.18); color: #6db87a; border-color: rgba(109,184,122,0.35); }
        .walk-dot.semi-local { background: rgba(224,160,48,0.18); color: #c98a00; border-color: rgba(224,160,48,0.35); }
        .walk-dot.expedition { background: rgba(100,150,255,0.18); color: #7090ee; border-color: rgba(100,150,255,0.35); }
 
        /* PLANNED WALKS */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .section-title { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--text); }
        .walks-list { display: flex; flex-direction: column; gap: 10px; }
 
        .walk-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }
        .walk-card:hover { border-color: var(--accent); }
        .walk-card.expedition-card { border-left: 3px solid #7090ee; }
        .walk-card.past-card { opacity: 0.55; }
 
        .walk-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .walk-card-meta { flex: 1; min-width: 0; }
        .walk-card-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }
 
        .walk-date { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
        .walk-date.expedition-date { color: #7090ee; }
        .walk-countdown {
            display: inline-block;
            font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 10px;
            background: var(--accent-dim); color: var(--accent);
            margin-bottom: 5px;
        }
        .walk-countdown.soon { background: rgba(224,160,48,0.15); color: #c98a00; }
        .walk-countdown.today { background: rgba(224,100,80,0.15); color: #e05555; }
        .walk-countdown.past { background: var(--surface2); color: var(--text3); }
        .walk-type-badge {
            display: inline-block; padding: 2px 7px;
            border-radius: 20px; font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px;
        }
        .badge-local { background: rgba(109,184,122,0.15); color: var(--accent); }
        .badge-semi-local { background: rgba(255,180,50,0.15); color: #c98a00; }
        .badge-expedition { background: rgba(100,150,255,0.15); color: #7090ee; }
        .walk-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .walk-info { font-size: 13px; color: var(--text2); line-height: 1.5; }
        .walk-time { font-size: 12px; color: var(--text3); margin-top: 3px; }
 
        /* WHO'S COMING */
        .whos-coming { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .whos-coming-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 8px; }
        .attendees { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .attendee-chip {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px;
            background: var(--surface2); border: 1px solid var(--border2);
            font-size: 12px; color: var(--text2);
        }
        .attendee-chip .remove-attendee {
            background: none; border: none; color: var(--text3);
            cursor: pointer; font-size: 13px; padding: 0; line-height: 1;
        }
        .add-attendee-row { display: flex; gap: 6px; }
        .add-attendee-input {
            flex: 1; padding: 6px 10px;
            border-radius: 6px; border: 1px solid var(--border2);
            background: var(--surface2); color: var(--text);
            font-size: 13px; font-family: 'DM Sans', sans-serif;
            min-width: 0;
        }
        .add-attendee-input:focus { outline: none; border-color: var(--accent); }
        .add-attendee-btn {
            padding: 6px 12px; border-radius: 6px;
            border: 1px solid var(--accent); background: var(--accent-dim);
            color: var(--accent); font-size: 13px;
            font-family: 'DM Sans', sans-serif; cursor: pointer;
            white-space: nowrap;
        }
 
        /* CARD ACTION BUTTONS */
        .delete-btn {
            background: transparent; border: 1px solid var(--border2);
            color: var(--danger); padding: 5px 10px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; transition: background 0.15s;
            white-space: nowrap;
        }
        .delete-btn:hover { background: rgba(220,80,80,0.1); }
        .whatsapp-btn {
            display: block; padding: 5px 10px;
            border-radius: 6px; border: 1px solid #25d366;
            background: rgba(37,211,102,0.08); color: #1da851;
            font-size: 12px; font-family: 'DM Sans', sans-serif;
            cursor: pointer; text-decoration: none;
            white-space: nowrap; text-align: center;
            transition: background 0.15s;
        }
        .whatsapp-btn:hover { background: rgba(37,211,102,0.18); }
 
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; line-height: 1.7; }
 
        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: var(--modal-bg); z-index: 2000;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 16px 16px 0 0;
            padding: 1.5rem 1.25rem;
            width: 100%; max-width: 560px;
            max-height: 92vh; overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 1.25rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
        .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--text); }
        .modal-date-label { font-size: 13px; color: var(--accent); font-weight: 500; margin-top: 2px; }
        .close-btn {
            background: var(--surface2); border: 1px solid var(--border2);
            color: var(--text2); width: 28px; height: 28px;
            border-radius: 6px; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text3); margin-bottom: 5px;
        }
        .form-control {
            width: 100%; padding: 10px 12px;
            border-radius: 8px; border: 1px solid var(--border2);
            background: var(--surface2); color: var(--text);
            font-size: 15px; font-family: 'DM Sans', sans-serif;
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }
        .form-control:focus { outline: none; border-color: var(--accent); }
        textarea.form-control { resize: vertical; min-height: 72px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 
        .expedition-fields {
            display: none; background: rgba(100,150,255,0.06);
            border: 1px solid rgba(100,150,255,0.25);
            border-radius: 8px; padding: 12px; margin-bottom: 12px;
        }
        .expedition-fields.visible { display: block; }
        .expedition-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #7090ee; margin-bottom: 8px; }
 
        .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
        .btn-ghost {
            padding: 11px 18px; border-radius: 8px;
            border: 1px solid var(--border2); background: transparent;
            color: var(--text2); font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer;
        }
        .btn-primary {
            flex: 1; padding: 11px 22px; border-radius: 8px;
            border: none; background: var(--accent); color: white;
            font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.85; }
 
        /* TOAST */
        .toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: var(--surface3); border: 1px solid var(--border2);
            color: var(--text); padding: 10px 18px;
            border-radius: 8px; font-size: 13px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 9999; white-space: nowrap;
            box-shadow: var(--shadow);
        }
        .toast.show { opacity: 1; }
 
        /* DESKTOP overrides */
        @media (min-width: 640px) {
            header { padding: 0 2rem; height: 60px; }
            .logo { font-size: 1.5rem; }
            nav { padding: 0 2rem; }
            main { padding: 2rem 1.5rem; }
            #map { height: 420px; }
            .cal-cell { min-height: 80px; }
            .modal-overlay { align-items: center; }
            .modal-box { border-radius: 14px; padding: 2rem; }
            .modal-handle { display: none; }
            .walk-card-actions { flex-direction: row; align-items: center; }
        }
    </style>
</head>
<body>
 
<header>
    <div class="logo"><div class="logo-dot"></div>Walking Club</div>
    <div class="header-right">
        <button class="data-btn" onclick="loadFromBin(true)" id="refresh-btn">Refresh</button>
        <div class="theme-toggle">
            <span>Dark</span>
            <div class="toggle-switch" onclick="toggleTheme()"></div>
            <span>Light</span>
        </div>
    </div>
</header>
 
<nav>
    <div class="nav-tab active" onclick="switchTab('map', this)">Map</div>
    <div class="nav-tab" onclick="switchTab('calendar', this)">Calendar</div>
    <div class="nav-tab" onclick="switchTab('walks', this)">Planned Walks</div>
</nav>
 
<main>
 
    <!-- MAP -->
    <div id="section-map" class="section active">
        <div class="map-controls">
            <button class="map-btn active" onclick="setMapView(51.8523,-3.1447,13,this)">Home Base</button>
            <button class="map-btn" onclick="setMapView(51.8835,-3.4378,11,this)">Brecon Beacons</button>
            <button class="map-btn" onclick="setMapView(51.7200,-3.4000,12,this)">Rhondda Valley</button>
            <button class="map-btn" onclick="setMapView(51.9600,-3.1500,11,this)">Black Mountains</button>
            <button class="map-btn" onclick="setMapView(51.6500,-3.9500,11,this)">Gower Peninsula</button>
        </div>
        <div id="map"></div>
    </div>
 
    <!-- CALENDAR -->
    <div id="section-calendar" class="section">
        <div class="cal-header">
            <div class="cal-controls">
                <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
                <div class="cal-title" id="cal-title"></div>
                <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
            </div>
            <div class="cal-selects">
                <select id="year-select" onchange="onYearMonthChange()"></select>
                <select id="month-select" onchange="onYearMonthChange()">
                    <option value="0">January</option><option value="1">February</option>
                    <option value="2">March</option><option value="3">April</option>
                    <option value="4">May</option><option value="5">June</option>
                    <option value="6">July</option><option value="7">August</option>
                    <option value="8">September</option><option value="9">October</option>
                    <option value="10">November</option><option value="11">December</option>
                </select>
            </div>
        </div>
        <div class="calendar-grid">
            <div class="cal-day-headers">
                <div class="cal-day-header">Su</div><div class="cal-day-header">Mo</div>
                <div class="cal-day-header">Tu</div><div class="cal-day-header">We</div>
                <div class="cal-day-header">Th</div><div class="cal-day-header">Fr</div>
                <div class="cal-day-header">Sa</div>
            </div>
            <div class="cal-days" id="cal-days"></div>
        </div>
    </div>
 
    <!-- PLANNED WALKS -->
    <div id="section-walks" class="section">
        <div class="section-header">
            <h2 class="section-title">Planned Walks</h2>
            <button class="btn-primary" style="flex:none;padding:8px 16px;font-size:14px;" onclick="openModal(null)">+ Add Walk</button>
        </div>
        <div class="walks-list" id="walks-list"></div>
    </div>
 
</main>
 
<!-- WALK MODAL -->
<div class="modal-overlay" id="walk-modal">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div>
                <div class="modal-title">Plan a Walk</div>
                <div class="modal-date-label" id="modal-date-label"></div>
            </div>
            <button class="close-btn" onclick="closeModal()">&#x2715;</button>
        </div>
 
        <div class="form-group">
            <label class="form-label">Walk name / destination</label>
            <input type="text" class="form-control" id="f-name" placeholder="e.g. Pen y Fan summit" />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Walk type</label>
                <select class="form-control" id="f-type" onchange="onTypeChange()">
                    <option value="local">Local</option>
                    <option value="semi-local">Semi-Local</option>
                    <option value="expedition">Expedition</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Meeting point</label>
                <input type="text" class="form-control" id="f-meet" placeholder="e.g. Car park, A470" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Start date</label>
                <input type="date" class="form-control" id="f-date" />
            </div>
            <div class="form-group">
                <label class="form-label">Start time</label>
                <input type="time" class="form-control" id="f-time" value="09:00" />
            </div>
        </div>
        <div class="expedition-fields" id="expedition-fields">
            <div class="expedition-label">Multi-day expedition</div>
            <div class="form-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label">End date</label>
                    <input type="date" class="form-control" id="f-end-date" />
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label">Est. end time</label>
                    <input type="time" class="form-control" id="f-end-time" value="17:00" />
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="f-notes" placeholder="What to bring, difficulty, route info..."></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveWalk()">Save Walk</button>
        </div>
    </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// THEME
function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('wc-theme', next);
}
(function(){ const s = localStorage.getItem('wc-theme'); if(s) document.documentElement.setAttribute('data-theme', s); })();
 
// TOAST
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}
 
// TABS
function switchTab(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
    el.classList.add('active');
    if (id === 'map') setTimeout(() => map.invalidateSize(), 100);
}
 
// MAP
var map = L.map('map').setView([51.8523, -3.1447], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
L.marker([51.8523, -3.1447]).addTo(map).bindPopup('<b>Walking Club Base</b><br>Meet up here!').openPopup();
function setMapView(lat, lng, zoom, btn) {
    map.setView([lat, lng], zoom);
    document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
 
// CALENDAR
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth();
const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
 
function populateYearSelect() {
    const sel = document.getElementById('year-select');
    for (let y = 2025; y <= 2050; y++) {
        const o = document.createElement('option');
        o.value = y; o.textContent = y; sel.appendChild(o);
    }
    sel.value = curYear;
    document.getElementById('month-select').value = curMonth;
}
 
function onYearMonthChange() {
    curYear = parseInt(document.getElementById('year-select').value);
    curMonth = parseInt(document.getElementById('month-select').value);
    renderCalendar();
}
 
function changeMonth(dir) {
    curMonth += dir;
    if (curMonth > 11) { curMonth = 0; curYear++; }
    if (curMonth < 0) { curMonth = 11; curYear--; }
    document.getElementById('year-select').value = curYear;
    document.getElementById('month-select').value = curMonth;
    renderCalendar();
}
 
function renderCalendar() {
    document.getElementById('cal-title').textContent = monthNames[curMonth] + ' ' + curYear;
    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);
    const container = document.getElementById('cal-days');
    container.innerHTML = '';
 
    for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell empty';
        container.appendChild(cell);
    }
    for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        const dateKey = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cellDate = new Date(curYear, curMonth, d);
        cell.className = 'cal-cell' + (cellDate < today ? ' past' : '');
        if (cellDate.getTime() === today.getTime()) cell.classList.add('today');
 
        const numDiv = document.createElement('div');
        numDiv.className = 'day-num';
        numDiv.textContent = d;
        cell.appendChild(numDiv);
 
        walksData.forEach(w => {
            const endDate = w.endDate || w.date;
            if (dateKey >= w.date && dateKey <= endDate) {
                const dot = document.createElement('div');
                dot.className = `walk-dot ${w.type}`;
                dot.textContent = w.name || w.type;
                cell.appendChild(dot);
            }
        });
 
        cell.onclick = () => openModal(dateKey);
        container.appendChild(cell);
    }
}
 
// JSONBIN
const BIN_ID  = '69d170af856a682189fd2cd0';
const API_KEY = '$2a$10$XKkwAdWOvXL56wbssqK28.q0ZljsW7pug3F8SlwaNe/9PJ6Xp58CW';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
let walksData = [];
 
async function loadFromBin(showMsg) {
    const btn = document.getElementById('refresh-btn');
    btn.textContent = 'Loading...'; btn.disabled = true;
    try {
        const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
        if (!res.ok) throw new Error(res.status);
        const json = await res.json();
        walksData = json.record.walks || [];
        renderCalendar(); renderWalksList();
        if (showMsg) showToast(`Refreshed — ${walksData.length} walk${walksData.length !== 1 ? 's' : ''} loaded.`);
    } catch(e) { showToast('Could not load data. Check connection.'); }
    btn.textContent = 'Refresh'; btn.disabled = false;
}
 
async function saveToBin() {
    try {
        const res = await fetch(BIN_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify({ walks: walksData })
        });
        if (!res.ok) throw new Error(res.status);
    } catch(e) { showToast('Could not save. Check connection.'); }
}
 
// COUNTDOWN
function getCountdown(dateKey) {
    const today = new Date(); today.setHours(0,0,0,0);
    const [y,m,d] = dateKey.split('-').map(Number);
    const walkDate = new Date(y, m-1, d);
    const diff = Math.round((walkDate - today) / 86400000);
    if (diff < 0) return { label: 'Past', cls: 'past' };
    if (diff === 0) return { label: 'Today!', cls: 'today' };
    if (diff === 1) return { label: 'Tomorrow', cls: 'soon' };
    if (diff <= 7) return { label: `In ${diff} days`, cls: 'soon' };
    return { label: `In ${diff} days`, cls: '' };
}
 
// WHATSAPP
function buildWhatsAppLink(w) {
    const dateStr = formatDate(w.date);
    const name = w.name || 'the walk';
    let msg = `I'm in for ${name} on ${dateStr}!`;
    if (w.meet) msg += ` Meet at: ${w.meet}`;
    if (w.time) msg += `, ${w.time}`;
    return `https://wa.me/?text=${encodeURIComponent(msg)}`;
}
 
// MODAL
function onTypeChange() {
    const type = document.getElementById('f-type').value;
    const expFields = document.getElementById('expedition-fields');
    if (type === 'expedition') {
        expFields.classList.add('visible');
        const sd = document.getElementById('f-date').value;
        if (!document.getElementById('f-end-date').value && sd) document.getElementById('f-end-date').value = sd;
    } else {
        expFields.classList.remove('visible');
    }
}
 
function openModal(dateKey) {
    document.getElementById('modal-date-label').textContent = dateKey ? formatDate(dateKey) : '';
    document.getElementById('f-date').value = dateKey || '';
    document.getElementById('f-end-date').value = dateKey || '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-time').value = '09:00';
    document.getElementById('f-end-time').value = '17:00';
    document.getElementById('f-type').value = 'local';
    document.getElementById('f-meet').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('expedition-fields').classList.remove('visible');
    document.getElementById('walk-modal').classList.add('open');
}
 
function closeModal() { document.getElementById('walk-modal').classList.remove('open'); }
 
function formatDate(dateKey) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-');
    return `${parseInt(d)} ${monthNames[parseInt(m)-1]} ${y}`;
}
 
async function saveWalk() {
    const name  = document.getElementById('f-name').value.trim();
    const date  = document.getElementById('f-date').value;
    const time  = document.getElementById('f-time').value;
    const type  = document.getElementById('f-type').value;
    const meet  = document.getElementById('f-meet').value.trim();
    const notes = document.getElementById('f-notes').value.trim();
    const endDate = type === 'expedition' ? document.getElementById('f-end-date').value : date;
    const endTime = type === 'expedition' ? document.getElementById('f-end-time').value : '';
    if (!date) { showToast('Please pick a start date.'); return; }
    if (type === 'expedition' && endDate && endDate < date) { showToast('End date must be after start date.'); return; }
    walksData.push({ id: Date.now(), name, date, time, type, meet, notes, endDate, endTime, attendees: [] });
    walksData.sort((a, b) => a.date.localeCompare(b.date));
    await saveToBin();
    closeModal(); renderCalendar(); renderWalksList();
    showToast('Walk saved.');
}
 
async function deleteWalk(id) {
    walksData = walksData.filter(w => w.id !== id);
    await saveToBin(); renderCalendar(); renderWalksList();
    showToast('Walk deleted.');
}
 
async function addAttendee(walkId) {
    const input = document.getElementById(`att-input-${walkId}`);
    const name = input.value.trim();
    if (!name) return;
    const walk = walksData.find(w => w.id === walkId);
    if (!walk) return;
    if (!walk.attendees) walk.attendees = [];
    if (walk.attendees.includes(name)) { showToast('Already added.'); return; }
    walk.attendees.push(name);
    await saveToBin(); renderWalksList();
}
 
async function removeAttendee(walkId, name) {
    const walk = walksData.find(w => w.id === walkId);
    if (!walk) return;
    walk.attendees = (walk.attendees || []).filter(a => a !== name);
    await saveToBin(); renderWalksList();
}
 
function renderWalksList() {
    const container = document.getElementById('walks-list');
    const today = new Date(); today.setHours(0,0,0,0);
 
    // Sort: upcoming first, then past
    const upcoming = walksData.filter(w => new Date(w.date) >= today);
    const past = walksData.filter(w => new Date(w.date) < today);
    const sorted = [...upcoming, ...past];
 
    if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-state">No walks planned yet.<br>Click a date on the calendar or tap the button above.</div>';
        return;
    }
    container.innerHTML = '';
    sorted.forEach(w => {
        const badgeClass = w.type === 'local' ? 'badge-local' : w.type === 'semi-local' ? 'badge-semi-local' : 'badge-expedition';
        const isExp = w.type === 'expedition';
        const isPast = new Date(w.date) < today;
        const dateDisplay = isExp && w.endDate && w.endDate !== w.date
            ? `${formatDate(w.date)} &ndash; ${formatDate(w.endDate)}`
            : formatDate(w.date);
        const timeDisplay = isExp && w.endTime
            ? `Depart ${w.time} &mdash; Est. return ${w.endTime}`
            : w.time ? w.time : '';
        const countdown = getCountdown(w.date);
        const attendees = w.attendees || [];
 
        const card = document.createElement('div');
        card.className = 'walk-card' + (isExp ? ' expedition-card' : '') + (isPast ? ' past-card' : '');
        card.innerHTML = `
            <div class="walk-card-top">
                <div class="walk-card-meta">
                    <div class="walk-date ${isExp ? 'expedition-date' : ''}">${dateDisplay}</div>
                    <span class="walk-countdown ${countdown.cls}">${countdown.label}</span>
                    <span class="walk-type-badge ${badgeClass}">${w.type}</span>
                    ${w.name ? `<div class="walk-name">${w.name}</div>` : ''}
                    ${w.meet ? `<div class="walk-info">Meet: ${w.meet}</div>` : ''}
                    ${w.notes ? `<div class="walk-info">${w.notes}</div>` : ''}
                    ${timeDisplay ? `<div class="walk-time">${timeDisplay}</div>` : ''}
                </div>
                <div class="walk-card-actions">
                    <button class="delete-btn" onclick="deleteWalk(${w.id})">Delete</button>
                </div>
            </div>
            <div class="whos-coming">
                <div class="whos-coming-title">Who's coming (${attendees.length})</div>
                <div class="attendees" id="att-list-${w.id}">
                    ${attendees.map(a => `
                        <div class="attendee-chip">
                            ${a}
                            <button class="remove-attendee" onclick="removeAttendee(${w.id}, '${a.replace(/'/g,"\\'")}')">&#x2715;</button>
                        </div>`).join('')}
                </div>
                <div class="add-attendee-row">
                    <input class="add-attendee-input" id="att-input-${w.id}" type="text" placeholder="Your name..."
                        onkeydown="if(event.key==='Enter') addAttendee(${w.id})" />
                    <button class="add-attendee-btn" onclick="addAttendee(${w.id})">I'm in</button>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}
 
// INIT
populateYearSelect();
renderCalendar();
renderWalksList();
loadFromBin(false);
</script>
</body>
</html>
